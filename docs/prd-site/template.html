<title>Bugsy PRD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a PRD in pages. Sticky title bar, a page list on the left (a scrolling strip on phones), one reading column per page, interactive views set off as panels. Same identity as the October crosswalk. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --sunk: #eaeeea;
  --ink: #18211d;
  --muted: #56625c;
  --line: #d6ddd7;
  --accent: #2c6a4c;
  --accent-ink: #ffffff;
  --accent-tint: #e1eee6;
  --yes: #2f7d52;
  --partial: #b57a14;
  --addon: #2d63a8;
  --no: #b3403a;
  --unknown: #8a948e;
  --risk-bg: #fbefe6;
  --risk-ink: #8a3b12;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #181f1b; --sunk: #202823; --ink: #e4eae6; --muted: #9ba7a0; --line: #2d3732;
    --accent: #79c29c; --accent-ink: #0f1a14; --accent-tint: #1d2f25; --yes: #5fb784; --partial: #d9a443; --addon: #6f9fdf; --no: #e07b72; --unknown: #78827c;
    --risk-bg: #2c1f16; --risk-ink: #f0b58c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #181f1b; --sunk: #202823; --ink: #e4eae6; --muted: #9ba7a0; --line: #2d3732;
  --accent: #79c29c; --accent-ink: #0f1a14; --accent-tint: #1d2f25; --yes: #5fb784; --partial: #d9a443; --addon: #6f9fdf; --no: #e07b72; --unknown: #78827c;
  --risk-bg: #2c1f16; --risk-ink: #f0b58c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--sunk); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* title bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; gap: 12px 20px; align-items: baseline; flex-wrap: wrap; }
.bar h1 { font-size: 26px; letter-spacing: 0.005em; }
.bar .meta { font: 500 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.bar .pager { margin-left: auto; display: flex; gap: 6px; }
.bar .pager button { font: 600 13px var(--font-body); background: var(--sunk); color: var(--ink); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.bar .pager button:disabled { opacity: 0.4; cursor: default; }

/* shell */
.shell { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 72px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; }
nav.pages { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 2px; }
nav.pages button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 4px; font: 500 14.5px var(--font-body); color: var(--muted); border-left: 3px solid transparent; }
nav.pages button:hover { color: var(--ink); background: var(--sunk); }
nav.pages button[aria-current="page"] { color: var(--ink); font-weight: 600; border-left-color: var(--accent); background: var(--surface); }
nav.pages button:focus-visible { outline: 2px solid var(--accent); }
main { min-width: 0; }

/* page prose */
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.widget { min-width: 0; }
.page > h2 { font-size: clamp(28px, 4vw, 38px); margin-top: 14px; }
.page > h2:first-child { margin-top: 0; }
.page > p, .page > ul, .page > ol { max-width: 76ch; margin: 0; }
.page ul, .page ol { padding-left: 22px; display: grid; gap: 6px; }
.page li > p { margin: 0; }
.page strong { font-weight: 600; }
.xwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.page table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
.page th, .page td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.page th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--sunk); }
.page tbody tr:last-child td { border-bottom: 0; }
.page td { font-variant-numeric: tabular-nums; }
pre.src { white-space: pre-wrap; font: 13px var(--font-mono); background: var(--surface); padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); }

/* panels and widgets */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.panel h3 { font-size: 20px; }
.lede { color: var(--muted); max-width: 72ch; margin: 0; }
.small { font-size: 13px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .n { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi.alert .n { color: var(--risk-ink); }

/* status marks: shape and color both carry the state */
.st { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font: 600 12px/1 var(--font-mono); border: 2px solid transparent; }
.st-Yes { background: var(--yes); border-color: var(--yes); }
.st-Partial { border-color: var(--partial); background: linear-gradient(90deg, var(--partial) 50%, transparent 50%); }
.st-Add-on { border-color: var(--addon); color: var(--addon); }
.st-Add-on::after { content: "+"; }
.st-No { border-color: var(--no); color: var(--no); }
.st-No::after { content: "\00D7"; }
.st-Unknown { border: 2px dashed var(--unknown); color: var(--unknown); }
.st-Unknown::after { content: "?"; font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.legend .item { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }

.plan { display: inline-block; font: 500 11.5px/1 var(--font-mono); padding: 4px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.plan[data-plan="In scope"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.plan[data-plan="Decide"] { border-style: dashed; color: var(--risk-ink); border-color: var(--risk-ink); }
.plan[data-plan="Out of scope"] { background: var(--sunk); }
.pos { font: 500 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

/* filters and controls */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.filters label, .ctl label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.filters select, .filters input[type="search"], .ctl input[type="number"] { font: 14px var(--font-body); padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); min-width: 0; }
.filters input[type="search"] { width: min(240px, 100%); }
.ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 14px 18px; }
.ctl .out { font: 600 15px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctl input[type="number"] { width: 100%; }

/* matrix */
.matrix-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: 78vh; }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1060px; font-size: 13.5px; }
table.matrix th, table.matrix td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; background: var(--surface); }
table.matrix thead th { position: sticky; top: 0; z-index: 2; font: 600 12px var(--font-body); color: var(--muted); background: var(--sunk); }
table.matrix thead th .spec { display: block; font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--unknown); }
table.matrix th.feat, table.matrix td.feat { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 250px; max-width: 290px; box-shadow: 1px 0 0 var(--line); }
table.matrix thead th.feat { z-index: 3; }
table.matrix td.feat .id { display: block; color: var(--muted); font: 500 11.5px var(--font-mono); }
table.matrix td.feat button { all: unset; cursor: pointer; font-weight: 500; }
table.matrix td.feat button:hover { color: var(--accent); text-decoration: underline; }
table.matrix td.bugsy, table.matrix th.bugsy { background: var(--accent-tint); }
table.matrix tr.group td { background: var(--sunk); text-align: left; font: 700 14px var(--font-display); letter-spacing: 0.02em; }
table.matrix td button.cell { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 4px; }
table.matrix td button.cell:hover { background: var(--sunk); }
table.matrix td button.cell:focus-visible { outline: 2px solid var(--accent); }
table.matrix td.count { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { padding: 24px; color: var(--muted); text-align: center; }

.flist { display: grid; }
.fitem { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.fitem:first-child { border-top: 0; }
.fitem button.fname { all: unset; cursor: pointer; font-weight: 500; }
.fitem button.fname:hover { color: var(--accent); text-decoration: underline; }
.fitem .count { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }

/* dossier */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 500 13.5px var(--font-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
dl.facts { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.plist { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.drow { display: grid; grid-template-columns: 62px minmax(0, 220px) 22px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; font-size: 14px; }
.drow .note { color: var(--muted); overflow-wrap: anywhere; }
.drow .note a { font-size: 12.5px; }
.module-h { padding-top: 10px; font-size: 17px; }
details summary { cursor: pointer; font-weight: 600; }
.srclist { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; overflow-wrap: anywhere; }
.covbar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.covbar span { display: block; height: 100%; }
.b-Yes { background: var(--yes); } .b-Add-on { background: var(--addon); } .b-Partial { background: var(--partial); }
.b-No { background: var(--no); } .b-Unknown { background: repeating-linear-gradient(45deg, var(--unknown) 0 3px, transparent 3px 6px); }

/* horizontal bar charts (pricing, market) */
.hbars { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13.5px; }
.hrow .nm { min-width: 0; }
.hrow .nm small { display: block; color: var(--muted); font-size: 11.5px; }
.hrow .track { height: 16px; background: var(--sunk); border-radius: 3px; position: relative; }
.hrow .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--unknown); }
.hrow .fill.est { background: repeating-linear-gradient(45deg, var(--unknown) 0 4px, transparent 4px 7px); border: 1px solid var(--unknown); }
.hrow.us .fill { background: var(--accent); }
.hrow.us .nm { font-weight: 600; }
.hrow .val { text-align: right; font: 600 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.big { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; }

/* diagrams */
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 560px; }
.dg-title { font: 600 15px var(--font-body); fill: var(--ink); }
.dg-name { font: 600 13px var(--font-body); fill: var(--ink); }
.dg-sub { font: 400 11.5px var(--font-body); fill: var(--muted); }
.dg-note { font: 400 12px var(--font-body); fill: var(--ink); }
.dg-box { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.dg-box.main { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
.dg-lane { fill: var(--sunk); stroke: var(--line); }
.dg-line { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.dg-lead { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.dg-head { fill: var(--muted); }

/* detail sheet */
#sheet { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(480px, calc(100vw - 32px)); max-height: min(74vh, 660px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,0.22); padding: 18px; display: grid; gap: 12px; }
#sheet .close { justify-self: end; font: 600 13px var(--font-body); background: var(--sunk); color: var(--ink); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 6px; }
.srow.hl { background: var(--sunk); }
.srow .who { font-weight: 600; }
.srow .note { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 64px; }
  nav.pages { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 8; display: flex; overflow-x: auto; gap: 4px; background: var(--bg); padding-block: 6px; border-bottom: 1px solid var(--line); }
  nav.pages button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; border-radius: 0; }
  nav.pages button[aria-current="page"] { border-bottom-color: var(--accent); background: none; }
  .bar .pager { display: none; }
}
@media (max-width: 640px) {
  .bar h1 { font-size: 22px; }
  .fitem { grid-template-columns: minmax(0, 1fr) auto; }
  .fitem .mono { display: none; }
  dl.facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  dl.facts dd { margin-bottom: 8px; }
  .drow { grid-template-columns: 22px minmax(0, 1fr); }
  .drow .mono { display: none; }
  .drow .fn { grid-column: 2; font-weight: 600; }
  .drow .st { grid-row: 1; grid-column: 1; }
  .drow .note { grid-column: 2; }
  .hrow { grid-template-columns: minmax(0, 1fr) 76px; }
  .hrow .track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) {
  #sheet:not([hidden]) { animation: rise 160ms ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .hrow .fill { transition: width 180ms ease-out; }
}
</style>

<header class="bar">
  <div class="bar-in">
    <h1>Bugsy PRD</h1>
    <span class="meta" id="meta"></span>
    <div class="pager"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button></div>
  </div>
</header>
<div class="shell">
  <nav class="pages" id="nav" aria-label="PRD pages"></nav>
  <main id="pages"></main>
</div>
<div id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden>
  <button class="close" id="sheet-close" type="button">Close</button>
  <div id="sheet-body" style="display:grid;gap:10px"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const PAGES = /*__PAGES__*/null;

const STATUSES = ["Yes", "Add-on", "Partial", "No", "Unknown"];
const STATUS_LABEL = { "Yes": "Yes", "Add-on": "Add-on or higher tier", "Partial": "Partial", "No": "No", "Unknown": "Not confirmed" };
const PLAN_ORDER = ["In scope", "Decide", "Out of scope"];
const PLAN_SHORT = { "In scope": "In scope", "Decide": "Decide", "Out of scope": "Out of scope" };
const COMPS = DATA.competitors;
const FEATS = DATA.features;
const FBYID = Object.fromEntries(FEATS.map(f => [f.id, f]));

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
function moneyM(n) { if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 2) + "M"; return "$" + Math.round(n / 1000).toLocaleString("en-US") + "K"; }
function mark(status) { return `<span class="st st-${esc(status)}" role="img" aria-label="${esc(STATUS_LABEL[status] || status)}"></span>`; }
function planPill(p) { return `<span class="plan" data-plan="${esc(p)}">${esc(PLAN_SHORT[p] || p)}</span>`; }
function yesCount(fid) { return COMPS.filter(c => (c.features[fid] || {}).status === "Yes").length; }
function offeredCount(fid) { return COMPS.filter(c => ["Yes", "Add-on"].includes((c.features[fid] || {}).status)).length; }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* ---------- detail sheet ---------- */
const sheet = document.getElementById("sheet"), sheetBody = document.getElementById("sheet-body");
let lastFocus = null;
function openSheet(html) { lastFocus = document.activeElement; sheetBody.innerHTML = html; sheet.hidden = false; document.getElementById("sheet-close").focus(); }
function closeSheet() { sheet.hidden = true; if (lastFocus) lastFocus.focus(); }
document.getElementById("sheet-close").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
function featureSheet(fid, highlight) {
  const f = FBYID[fid];
  const specs = f.specs.length ? "Spec " + f.specs.join(", ") : "No spec yet";
  let h = `<div class="eyebrow">${esc(f.id)} &middot; ${esc(f.module)}</div><h3 id="sheet-title">${esc(f.feature)}</h3><p class="lede small">${esc(f.definition)}</p>`;
  h += `<div class="srow hl"><span></span><div><div class="who">Bugsy ${planPill(f.plan)} <span class="mono">${esc(specs)}</span></div>${f.note ? `<div class="note">${esc(f.note)}</div>` : ""}</div></div>`;
  for (const c of COMPS) {
    const s = c.features[fid] || { status: "Unknown", notes: "", source: "" };
    const u = safeUrl(s.source);
    h += `<div class="srow${c.slug === highlight ? " hl" : ""}">${mark(s.status)}<div><div class="who">${esc(c.competitor)} <span class="mono">${esc(STATUS_LABEL[s.status])}</span></div><div class="note">${esc(s.notes)}${u ? ` <a href="${esc(u)}" target="_blank" rel="noopener">Source</a>` : ""}</div></div></div>`;
  }
  openSheet(h);
}

/* ---------- widgets ---------- */
const W = {};

W.kpis = node => {
  const wedge = FEATS.filter(f => f.positioning === "wedge");

  const tiles = [
    [String(COMPS.length), `competitors scored on ${FEATS.length} features`],
    [`${openWedge} of ${wedge.length}`, "wedge features no competitor fully supports"],
    [`${inScope} of ${FEATS.length}`, `features in scope for one build, across ${specs} specs`],
    ["13,603", "US pest control firms ($19.6B receipts, 2022)"],
    ["~4,090", "firms in the 3 to 15 technician band"],

W.matrix = node => {
  const modules = [...new Set(FEATS.map(f => f.module))];

    <div class="grid2">
      <div class="panel"><div><h3>Table stakes</h3><p class="lede small">Most competitors have these. Count is full support (Yes) out of ${COMPS.length}.</p></div><div class="flist">${flist(list("table-stakes"))}</div></div>
      <div class="panel"><div><h3>The wedge</h3><p class="lede small">Few or none fully support these. This is the pitch, and where the design partner must prove demand.</p></div><div class="flist">${flist(list("wedge"))}</div></div>
    </div>
    <div class="panel">
      <div><h3>All ${FEATS.length} features</h3><p class="lede small">The one feature list for the PRD and the crosswalk. Select a feature name or any mark to read the note and source.</p></div>
      <div class="legend">${STATUSES.map(s => `<span class="item">${mark(s)}${esc(STATUS_LABEL[s])}</span>`).join("")}<span class="item">${PLAN_ORDER.map(planPill).join(" ")} Bugsy's scope</span></div>
      <div class="filters">
        <label for="mx-module">Module<select id="mx-module"><option value="">All modules</option>${modules.map(m => `<option>${esc(m)}</option>`).join("")}</select></label>
        <label for="mx-plan">Bugsy scope<select id="mx-plan"><option value="">Any scope</option>${PLAN_ORDER.map(p => `<option value="${esc(p)}">${esc(DATA.plans[p])}</option>`).join("")}</select></label>
        <label for="mx-pos">Group<select id="mx-pos"><option value="">All features</option><option value="table-stakes">Table stakes</option><option value="wedge">Wedge</option></select></label>
        <label for="mx-q">Search<input id="mx-q" type="search" placeholder="Feature name or ID"></label>
        <label for="mx-sort">Sort<select id="mx-sort"><option value="module">By module</option><option value="common">Most supported first</option><option value="rare">Least supported first</option></select></label>
      </div>
      <div class="matrix-wrap"><table class="matrix" aria-label="Feature coverage matrix"></table></div>
    </div></div>`;
  const table = node.querySelector("table.matrix");
  const get = id => node.querySelector(id).value;
  function draw() {
    const mod = get("#mx-module"), plan = get("#mx-plan"), pos = get("#mx-pos"), q = get("#mx-q").trim().toLowerCase(), sort = get("#mx-sort");
    let rows = FEATS.filter(f => (!mod || f.module === mod) && (!plan || f.plan === plan) && (!pos || f.positioning === pos) && (!q || f.feature.toLowerCase().includes(q) || f.id.toLowerCase().includes(q)));
    if (sort === "common") rows = [...rows].sort((a, b) => yesCount(b.id) - yesCount(a.id) || offeredCount(b.id) - offeredCount(a.id));
    if (sort === "rare") rows = [...rows].sort((a, b) => yesCount(a.id) - yesCount(b.id) || offeredCount(a.id) - offeredCount(b.id));
    let h = `<thead><tr><th class="feat">Feature</th><th class="bugsy">Bugsy</th>${COMPS.map(c => `<th>${esc(c.competitor)}<span class="spec">${c.pest ? "pest" : "general"}</span></th>`).join("")}<th>Yes<span class="spec">of ${COMPS.length}</span></th></tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td colspan="${COMPS.length + 3}" class="empty">No features match these filters.</td></tr>`;
    let cur = "";
    for (const f of rows) {
      if (sort === "module" && f.module !== cur) { cur = f.module; h += `<tr class="group"><td colspan="${COMPS.length + 3}">${esc(cur)}</td></tr>`; }
      h += `<tr><td class="feat"><span class="id">${esc(f.id)}${f.positioning ? ` &middot; <span class="pos">${f.positioning === "wedge" ? "wedge" : "table stakes"}</span>` : ""}</span><button type="button" data-fid="${esc(f.id)}">${esc(f.feature)}</button></td><td class="bugsy">${planPill(f.plan)}</td>`;
      for (const c of COMPS) { const s = (c.features[f.id] || {}).status || "Unknown"; h += `<td><button type="button" class="cell" data-fid="${esc(f.id)}" data-slug="${esc(c.slug)}" aria-label="${esc(c.competitor)}: ${esc(f.feature)}, ${esc(STATUS_LABEL[s])}">${mark(s)}</button></td>`; }
      h += `<td class="count">${yesCount(f.id)}</td></tr>`;
    }
    table.innerHTML = h + "</tbody>";
  }
  node.querySelectorAll("select, input").forEach(i => i.addEventListener("input", draw));
  node.addEventListener("click", e => { const b = e.target.closest("button[data-fid]"); if (b) featureSheet(b.dataset.fid, b.dataset.slug); });
  draw();
};

  s += `<polygon points="${cx - 110},${y1 + 244} ${cx},${y1 + 204} ${cx + 110},${y1 + 244} ${cx},${y1 + 284}" class="dg-box"/>` + txt(cx, y1 + 248, "dg-name", "Launch gate", "middle");
  s += txt(508, y1 + 240, "dg-sub", "30 business days on Bugsy,") + txt(508, y1 + 256, "dg-sub", "then the first month-end") + arrow(`M${cx} ${y1 + 284}V${y1 + 308}`);
  s += box(260, y1 + 308, 240, 40) + txt(cx, y1 + 332, "dg-name", "General availability", "middle");
  node.innerHTML = `<div class="diagram">${s}</svg></div>`;
};

/* ---------- pages and routing ---------- */
const nav = document.getElementById("nav"), main = document.getElementById("pages");
document.getElementById("meta").textContent = `Version 3 · ${DATA.generated_on} · ${PAGES.length} pages`;
function render(md) {
  const prepared = md.replace(/```mermaid[\s\S]*?```/g, "").replace(/<!--\s*widget:\s*([\w-]+)\s*-->/g, (m, w) => `\n<div class="widget" data-widget="${w}"></div>\n`);
  if (window.marked) return marked.parse(prepared, { gfm: true });
  return `<pre class="src">${esc(prepared.replace(/<div class="widget"[^>]*><\/div>/g, ""))}</pre>`;
}
for (const p of PAGES) {
  const sec = document.createElement("section");
  sec.className = "page"; sec.id = "page-" + p.id; sec.hidden = true; sec.setAttribute("aria-label", p.label);
  sec.innerHTML = render(p.markdown);
  sec.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "xwrap"; t.replaceWith(w); w.appendChild(t); });
  sec.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  main.appendChild(sec);
  const b = document.createElement("button"); b.type = "button"; b.textContent = p.label; b.dataset.page = p.id; nav.appendChild(b);
}
main.querySelectorAll(".widget").forEach(n => { const f = W[n.dataset.widget]; if (f) { try { f(n); } catch (err) { n.innerHTML = `<p class="lede">This view failed to load: ${esc(err.message)}</p>`; } } });
nav.addEventListener("click", e => { const b = e.target.closest("button[data-page]"); if (b) location.hash = b.dataset.page; });
function route() {
  const ids = PAGES.map(p => p.id);
  const id = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : ids[0];
  main.querySelectorAll(".page").forEach(s => { s.hidden = s.id !== "page-" + id; });
  nav.querySelectorAll("button").forEach(b => { if (b.dataset.page === id) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const i = ids.indexOf(id);
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  prev.disabled = i === 0; next.disabled = i === ids.length - 1;
  prev.onclick = () => { location.hash = ids[i - 1]; }; next.onclick = () => { location.hash = ids[i + 1]; };
  const cur = nav.querySelector('[aria-current="page"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
