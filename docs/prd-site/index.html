<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugsy PRD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a PRD in pages. Sticky title bar, a page list on the left (a scrolling strip on phones), one reading column per page, interactive views set off as panels. Same identity as the October crosswalk. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --sunk: #eaeeea;
  --ink: #18211d;
  --muted: #56625c;
  --line: #d6ddd7;
  --accent: #2c6a4c;
  --accent-ink: #ffffff;
  --accent-tint: #e1eee6;
  --yes: #2f7d52;
  --partial: #b57a14;
  --addon: #2d63a8;
  --no: #b3403a;
  --unknown: #8a948e;
  --risk-bg: #fbefe6;
  --risk-ink: #8a3b12;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #181f1b; --sunk: #202823; --ink: #e4eae6; --muted: #9ba7a0; --line: #2d3732;
    --accent: #79c29c; --accent-ink: #0f1a14; --accent-tint: #1d2f25; --yes: #5fb784; --partial: #d9a443; --addon: #6f9fdf; --no: #e07b72; --unknown: #78827c;
    --risk-bg: #2c1f16; --risk-ink: #f0b58c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #181f1b; --sunk: #202823; --ink: #e4eae6; --muted: #9ba7a0; --line: #2d3732;
  --accent: #79c29c; --accent-ink: #0f1a14; --accent-tint: #1d2f25; --yes: #5fb784; --partial: #d9a443; --addon: #6f9fdf; --no: #e07b72; --unknown: #78827c;
  --risk-bg: #2c1f16; --risk-ink: #f0b58c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--sunk); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* title bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; gap: 12px 20px; align-items: baseline; flex-wrap: wrap; }
.bar h1 { font-size: 26px; letter-spacing: 0.005em; }
.bar .meta { font: 500 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.bar .pager { margin-left: auto; display: flex; gap: 6px; }
.bar .pager button { font: 600 13px var(--font-body); background: var(--sunk); color: var(--ink); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.bar .pager button:disabled { opacity: 0.4; cursor: default; }

/* shell */
.shell { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 72px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; }
nav.pages { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 2px; }
nav.pages button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 4px; font: 500 14.5px var(--font-body); color: var(--muted); border-left: 3px solid transparent; }
nav.pages button:hover { color: var(--ink); background: var(--sunk); }
nav.pages button[aria-current="page"] { color: var(--ink); font-weight: 600; border-left-color: var(--accent); background: var(--surface); }
nav.pages button:focus-visible { outline: 2px solid var(--accent); }
main { min-width: 0; }

/* page prose */
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.widget { min-width: 0; }
.page > h2 { font-size: clamp(28px, 4vw, 38px); margin-top: 14px; }
.page > h2:first-child { margin-top: 0; }
.page > p, .page > ul, .page > ol { max-width: 76ch; margin: 0; }
.page ul, .page ol { padding-left: 22px; display: grid; gap: 6px; }
.page li > p { margin: 0; }
.page strong { font-weight: 600; }
.xwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.page table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
.page th, .page td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.page th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--sunk); }
.page tbody tr:last-child td { border-bottom: 0; }
.page td { font-variant-numeric: tabular-nums; }
pre.src { white-space: pre-wrap; font: 13px var(--font-mono); background: var(--surface); padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); }

/* panels and widgets */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.panel h3 { font-size: 20px; }
.lede { color: var(--muted); max-width: 72ch; margin: 0; }
.small { font-size: 13px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .n { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi.alert .n { color: var(--risk-ink); }

/* status marks: shape and color both carry the state */
.st { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font: 600 12px/1 var(--font-mono); border: 2px solid transparent; }
.st-Yes { background: var(--yes); border-color: var(--yes); }
.st-Partial { border-color: var(--partial); background: linear-gradient(90deg, var(--partial) 50%, transparent 50%); }
.st-Add-on { border-color: var(--addon); color: var(--addon); }
.st-Add-on::after { content: "+"; }
.st-No { border-color: var(--no); color: var(--no); }
.st-No::after { content: "\00D7"; }
.st-Unknown { border: 2px dashed var(--unknown); color: var(--unknown); }
.st-Unknown::after { content: "?"; font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.legend .item { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }

.plan { display: inline-block; font: 500 11.5px/1 var(--font-mono); padding: 4px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.plan[data-plan="In scope"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.plan[data-plan="Decide"] { border-style: dashed; color: var(--risk-ink); border-color: var(--risk-ink); }
.plan[data-plan="Out of scope"] { background: var(--sunk); }
.pos { font: 500 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

/* filters and controls */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.filters label, .ctl label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.filters select, .filters input[type="search"], .ctl input[type="number"] { font: 14px var(--font-body); padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); min-width: 0; }
.filters input[type="search"] { width: min(240px, 100%); }
.ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 14px 18px; }
.ctl .out { font: 600 15px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctl input[type="number"] { width: 100%; }

/* matrix */
.matrix-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: 78vh; }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1060px; font-size: 13.5px; }
table.matrix th, table.matrix td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; background: var(--surface); }
table.matrix thead th { position: sticky; top: 0; z-index: 2; font: 600 12px var(--font-body); color: var(--muted); background: var(--sunk); }
table.matrix thead th .spec { display: block; font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--unknown); }
table.matrix th.feat, table.matrix td.feat { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 250px; max-width: 290px; box-shadow: 1px 0 0 var(--line); }
table.matrix thead th.feat { z-index: 3; }
table.matrix td.feat .id { display: block; color: var(--muted); font: 500 11.5px var(--font-mono); }
table.matrix td.feat button { all: unset; cursor: pointer; font-weight: 500; }
table.matrix td.feat button:hover { color: var(--accent); text-decoration: underline; }
table.matrix td.bugsy, table.matrix th.bugsy { background: var(--accent-tint); }
table.matrix tr.group td { background: var(--sunk); text-align: left; font: 700 14px var(--font-display); letter-spacing: 0.02em; }
table.matrix td button.cell { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 4px; }
table.matrix td button.cell:hover { background: var(--sunk); }
table.matrix td button.cell:focus-visible { outline: 2px solid var(--accent); }
table.matrix td.count { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { padding: 24px; color: var(--muted); text-align: center; }

.flist { display: grid; }
.fitem { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.fitem:first-child { border-top: 0; }
.fitem button.fname { all: unset; cursor: pointer; font-weight: 500; }
.fitem button.fname:hover { color: var(--accent); text-decoration: underline; }
.fitem .count { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }

/* dossier */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 500 13.5px var(--font-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
dl.facts { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.plist { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.drow { display: grid; grid-template-columns: 62px minmax(0, 220px) 22px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; font-size: 14px; }
.drow .note { color: var(--muted); overflow-wrap: anywhere; }
.drow .note a { font-size: 12.5px; }
.module-h { padding-top: 10px; font-size: 17px; }
details summary { cursor: pointer; font-weight: 600; }
.srclist { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; overflow-wrap: anywhere; }
.covbar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.covbar span { display: block; height: 100%; }
.b-Yes { background: var(--yes); } .b-Add-on { background: var(--addon); } .b-Partial { background: var(--partial); }
.b-No { background: var(--no); } .b-Unknown { background: repeating-linear-gradient(45deg, var(--unknown) 0 3px, transparent 3px 6px); }

/* horizontal bar charts (pricing, market) */
.hbars { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13.5px; }
.hrow .nm { min-width: 0; }
.hrow .nm small { display: block; color: var(--muted); font-size: 11.5px; }
.hrow .track { height: 16px; background: var(--sunk); border-radius: 3px; position: relative; }
.hrow .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--unknown); }
.hrow .fill.est { background: repeating-linear-gradient(45deg, var(--unknown) 0 4px, transparent 4px 7px); border: 1px solid var(--unknown); }
.hrow.us .fill { background: var(--accent); }
.hrow.us .nm { font-weight: 600; }
.hrow .val { text-align: right; font: 600 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.big { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; }

/* diagrams */
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 560px; }
.dg-title { font: 600 15px var(--font-body); fill: var(--ink); }
.dg-name { font: 600 13px var(--font-body); fill: var(--ink); }
.dg-sub { font: 400 11.5px var(--font-body); fill: var(--muted); }
.dg-note { font: 400 12px var(--font-body); fill: var(--ink); }
.dg-box { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.dg-box.main { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
.dg-lane { fill: var(--sunk); stroke: var(--line); }
.dg-line { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.dg-lead { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.dg-head { fill: var(--muted); }

/* detail sheet */
#sheet { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(480px, calc(100vw - 32px)); max-height: min(74vh, 660px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,0.22); padding: 18px; display: grid; gap: 12px; }
#sheet .close { justify-self: end; font: 600 13px var(--font-body); background: var(--sunk); color: var(--ink); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 6px; }
.srow.hl { background: var(--sunk); }
.srow .who { font-weight: 600; }
.srow .note { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 64px; }
  nav.pages { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 8; display: flex; overflow-x: auto; gap: 4px; background: var(--bg); padding-block: 6px; border-bottom: 1px solid var(--line); }
  nav.pages button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; border-radius: 0; }
  nav.pages button[aria-current="page"] { border-bottom-color: var(--accent); background: none; }
  .bar .pager { display: none; }
}
@media (max-width: 640px) {
  .bar h1 { font-size: 22px; }
  .fitem { grid-template-columns: minmax(0, 1fr) auto; }
  .fitem .mono { display: none; }
  dl.facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  dl.facts dd { margin-bottom: 8px; }
  .drow { grid-template-columns: 22px minmax(0, 1fr); }
  .drow .mono { display: none; }
  .drow .fn { grid-column: 2; font-weight: 600; }
  .drow .st { grid-row: 1; grid-column: 1; }
  .drow .note { grid-column: 2; }
  .hrow { grid-template-columns: minmax(0, 1fr) 76px; }
  .hrow .track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) {
  #sheet:not([hidden]) { animation: rise 160ms ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .hrow .fill { transition: width 180ms ease-out; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1>Bugsy PRD</h1>
    <span class="meta" id="meta"></span>
    <div class="pager"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button></div>
  </div>
</header>
<div class="shell">
  <nav class="pages" id="nav" aria-label="PRD pages"></nav>
  <main id="pages"></main>
</div>
<div id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden>
  <button class="close" id="sheet-close" type="button">Close</button>
  <div id="sheet-body" style="display:grid;gap:10px"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

 call tracking and SEO are services, not product; connect through the API instead."}],"competitors":[{"slug":"pestpac","pest":true,"competitor":"PestPac","researched_on":"2026-10-20","updated_on":"2026-10-31","profile":{"owner":"WorkWave LLC. EQT funds have held WorkWave as a standalone portfolio company since June 2021, after it separated from IFS, which bought it in 2017. Sister brands: RealGreen (lawn) and TEAM Software (WinTeam, Lighthouse).","website":"https://www.pestpac.com/","target_customers":"Pest control operators from small to enterprise, focused on mid-size and large multi-branch residential and commercial companies. The vendor claims it processes about 70% of PCT Top 100 revenue. Named users include Terminix, Truly Nolen and Arrow (third-party data). Capterra reviewers are mostly small businesses.","pricing":"Not published. Quote-based Small Business, Professional and Enterprise packages, with many features gated by tier. Third-party estimates only (CostBench, last verified June 2026): about $100 per user per month within a reported range of about $80 to $150; setup fees around $1,500, a figure that rests on a single Reddit report (one user reported it waived); annual auto-renewing contracts with 3 to 5% yearly increases. Extra notification credits are billed at unpublished tiered rates, and payment processing rates depend on volume.","pricing_source":"https://www.pestpac.com/pricing","deployment":"Cloud. Browser web app (PestPac Desktop) on Windows or macOS, modernized in March 2024, plus native mobile apps. Releases ship every two weeks.","mobile_app":"PestPac Mobile (version 3) for iOS and Android (64-bit devices, latest OS plus two prior versions). Rated 2.4 from 150 ratings on the US App Store and 2.26 from 336 ratings on Google Play per a third-party tracker (October 2026). Classic Mobile and Mobile 2 are retired.","integrations":["WorkWave Payments (native card, ACH, Apple Pay, Samsung Pay)","QuickBooks (general ledger export)","Avalara (tax compliance partner)","Voice for Pest phone system; Dialpad and TalkDesk via API","CallTrackingMetrics and Google Analytics","Azuga, Linxup and Verizon Connect telematics","Corteva Sentricon reporting","Bell smart traps and other smart trap hardware","Wisetack (Pay Over Time consumer financing) and YouLend (WorkWave Capital)","American Profit Recovery (collections)","Wavelytics Data Factory Snowflake share for Power BI or Tableau","PestPac Cloud API with webhooks"],"strengths":["Deep pest-specific tooling: termite WDI and NPMA-33 forms, Sentricon reporting, IPM device scanning, multi-unit buildings and smart traps.","Strong chemical tracking with built-in state reports (California, Arizona, New York) and inventory tracked from warehouse to truck.","Built for enterprise scale: RouteOp optimizes a month of routes, plus multi-branch, an API and adoption by large national operators.","Mobile app works fully offline, covering forms, signatures, materials and field payments.","Integrated payments and fintech: card updater, consumer financing and capital loans."],"weaknesses":["Reviewers call pricing high and opaque, citing costly modules, setup fees and long auto-renewing contracts.","The interface is complicated and dated, with a steep learning curve for admins and staff.","Reviewers report persistent bugs and slow support when issues need escalation.","The mobile app is rated 2.4 on the App Store and about 2.3 on Google Play, and some users report unreliable camera barcode scanning.","There is no built-in general ledger. QuickBooks is fed by a periodic GL export that the vendor says is not a live sync; reports of reconciliation discrepancies could not be verified in 2025 or 2026 reviews."],"wisconsin_notes":"No Wisconsin forms or ATCP 29 support found. The vendor names only California, Arizona and New York state reports plus generic state-specific exports. Wisconsin users exist though the vendor names none: a 2026-10-29 scan of Wisconsin pest company websites found PestPac ng-software"},"AGR-06":{"status":"Partial","notes":"Termite module manages inspections and renewals and a Renewals report exists; warranty records and automatic renewal billing reminders are not described.","source":"https://www.pestpac.com/features/termite-inspection-software"},"AGR-07":{"status":"Unknown","notes":"No callback logging or cost capture documented in core PestPac. Wavelytics is said to flag callback spikes, and the Customer Hub announced Oct 20, 2026 shows callback rate by technician; its availability and packaging are unconfirmed.","source":"https://www.prnewswire.com/news-releases/workwave-announces-two-new-ai-driven-analytics-decision-support-for-pestpac-and-realgreen-that-reduce-customer-churn-and-increase-services-per-tech-302913580.html"},"SCH-01":{"status":"Yes","notes":"Recurring services generate appointments from set frequencies, and RouteOp can optimize a full month of routes at once.","source":"https://www.pestpac.com/features/pest-control-scheduling-software"},"SCH-02":{"status":"Yes","notes":"Appointment scheduler shows technicians by hour with drag and drop moves, plus map and calendar views of routes.","source":"https://www.pestpac.com/features/pest-control-scheduling-software"},"SCH-03":{"status":"Add-on","notes":"RouteOp optimizes hundreds of orders across daily, weekly or monthly routes; Small Business gets basic routing, optimization starts at Professional.","source":"https://www.pestpac.com/pricing"},"SCH-04":{"status":"Yes","notes":"Technicians carry skill types such as termite license or wildlife trapping; RouteOp and the scheduler block or warn on unqualified assignments.","source":"https://www.pestpac.com/features/pest-control-routing-software"},"SCH-05":{"status":"Partial","notes":"CustomerConnect lets customers request service appointments and order services online; true self-scheduling into open slots is not documented.","source":"https://www.pestpac.com/features/customer-portal"},"SCH-06":{"status":"Yes","notes":"App tracks technician location without extra hardware, with a live Vehicle Map, Closest Tech, and Azuga or Verizon telematics integration.","source":"https://www.pestpac.com/features/pest-control-mobile-app"},"SCH-07":{"status":"Partial","notes":"RouteOp redistributes a technician's jobs for vacations or sick calls; weather-driven mass rescheduling is not documented.","source":"https://www.pestpac.com/features/pest-control-routing-software"},"MOB-01":{"status":"Yes","notes":"PestPac Mobile (version 3) for iOS and Android; App Store rating 2.4 from 150 ratings (October 2026).","source":"https://apps.apple.com/us/app/-/id1211298978"},"MOB-02":{"status":"Yes","notes":"Technicians complete work orders, log materials, take payments, fill forms and capture signatures offline, syncing on reconnect.","source":"https://www.pestpac.com/features/pest-control-mobile-app"},"MOB-03":{"status":"Yes","notes":"Technicians pick chemicals from a preset list with method, rate and quantity; EPA numbers auto-populate and unit thresholds limit entries.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"MOB-04":{"status":"Yes","notes":"App captures photos, diagrams, comments, documents and customer signatures at job completion.","source":"https://www.pestpac.com/features/pest-control-mobile-app"},"MOB-05":{"status":"Yes","notes":"Phone camera works as a barcode scanner for bait stations and devices; Socket S700 and S800 external scanners are supported.","source":"https://www.pestpac.com/features/termite-inspection-software"},"MOB-06":{"status":"Yes","notes":"Accepts cash, check, card and ACH in the field, shows unpaid invoices, and offers Pay Over Time financing.","source":"https://www.pestpac.com/features/pest-control-mobile-app"},"MOB-07":{"status":"Yes","notes":"App records time in and out of jobs and shows timesheets; a Timecards report supports payroll.","source":"https://apps.apple.com/us/app/-/id1211298978"},"MOB-08":{"status":"Partial","notes":"Materials used are deducted from truck inventory automatically; whether technicians can view or adjust truck stock on the device is not documented.","source":"https://www.pestpac.com/features/pest-control-mobile-app"},"CMP-01":{"status":"Yes","notes":"Visit records capture product, EPA number, target, method, rate and quantity, feeding state material reports.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"CMP-02":{"status":"Partial","notes":"Chemical list stores EPA registration numbers and concentrations; SDS sits in the commercial portal library, and label documents are not mentioned.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"CMP-03":{"status":"Partial","notes":"Scheduler warns when a technician lacks required licensing and forms pull license details; license expiry alerts are not documented.","source":"https://www.pestpac.com/features/pest-control-scheduling-software"},"CMP-04":{"status":"Yes","notes":"Built-in California material and Cal-Ag reports, New York material reports, Arizona TARF, plus other state-specific compliance exports.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"CMP-05":{"status":"Partial","notes":"Automated reminders and emailed service reports exist, but no dedicated pre-application pesticide notice or registry notification feature is documented.","source":"https://www.pestpac.com/features/customer-communication"},"CMP-06":{"status":"Unknown","notes":"No restricted-use pesticide controls or RUP record fields found; only per-chemical quantity thresholds and skill-based assignment.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"CMP-07":{"status":"Yes","notes":"Tracks stock from distributor to warehouse to truck, with transfers, returns, distributor file imports, cost export and expected usage reports.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"CMP-08":{"status":"Partial","notes":"Report formats for California (material and Cal-Ag), Arizona (TARF) and New York, plus generic state exports; no state notice, registry or posting rules applied in the workflow.","source":"https://www.pestpac.com/features/chemical-tracking-software"},"COM-01":{"status":"Add-on","notes":"IPM module manages devices per area with camera or Bluetooth scanning; IPM and Multi-Unit support start at the Professional package.","source":"https://www.pestpac.com/features/commercial-pest-control-software"},"COM-02":{"status":"Add-on","notes":"Technicians draw device locations, multi-unit floor plan schematics locate devices, and the portal maps devices. Professional package and up.","source":"https://www.pestpac.com/features/commercial-pest-control-software"},"COM-03":{"status":"Add-on","notes":"Commercial portal offers graphical trend reports and heat maps by area, date or pest; Logbook trend logs need Professional or higher.","source":"https://www.pestpac.com/features/customer-portal"},"COM-04":{"status":"Add-on","notes":"Logbook organizes inspection reports, sighting logs and licenses with auditor-only access; Auditor Reports are Enterprise only. AIB, SQF, BRC not named.","source":"https://www.pestpac.com/pricing"},"COM-05":{"status":"Yes","notes":"CustomerConnect+ gives commercial clients inspection reports, device floor plan maps, SDS sheets and compliance certificates online; labels not listed.","source":"https://www.pestpac.com/features/customer-portal"},"COM-06":{"status":"Add-on","notes":"Customers log sightings that create service tickets and track open conditions and IPM recommendations; part of Logbook, Professional package and up.","source":"https://www.pestpac.com/features/commercial-pest-control-software"},"COM-07":{"status":"Partial","notes":"Invoice consolidation and parent and child billing hierarchies exist; PO numbers and net terms are not documented.","source":"https://www.pestpac.com/features/accounting-software"},"SPC-01":{"status":"Yes","notes":"Grid and aerial sketches with footage measurement, Se 026) added Technician Tracker live On My Way notices.","source":"https://www.pestpac.com/features/customer-communication"},"CX-03":{"status":"Add-on","notes":"Communication Center provides two-way SMS and MMS with recorded conversations; part of Customer Communications, Professional package and up.","source":"https://www.pestpac.com/features/customer-communication"},"CX-04":{"status":"Yes","notes":"Online Reviews automates collection, letting technicians request reviews right after service and staff respond to reviews.","source":"https://www.pestpac.com/marketing/software-solutions"},"CX-05":{"status":"Yes","notes":"Inspection and service reports are emailed or printed from the field or after posting; materials are tracked on service orders.","source":"https://www.pestpac.com/features/customer-communication"},"RPT-01":{"status":"Yes","notes":"Standard reports include AR aging with as-of dates, sales by month, collections, payment register, material and service completion.","source":"https://www.pestpac.com/features/pest-control-reporting-software"},"RPT-02":{"status":"Partial","notes":"Customer Hub, announced Oct 20, 2026 in Wavelytics Decision Intelligence, scores each account's risk of canceling with reasons and revenue at risk. No rates by route, technician or service; availability and packaging are unconfirmed, and the Wavelytics page still says Coming Soon.","source":"https://www.prnewswire.com/news-releases/workwave-announces-two-new-ai-driven-analytics-decision-support-for-pestpac-and-realgreen-that-reduce-customer-churn-and-increase-services-per-tech-302913580.html"},"RPT-03":{"status":"Yes","notes":"Technician Production, Timecards, schedule-to-actual and Route Comparison reports cover technician output.","source":"https://www.pestpac.com/features/pest-control-reporting-software"},"RPT-04":{"status":"Add-on","notes":"Report Writer and Custom Reporting come with Professional and up; Wavelytics Data Factory, a separately purchased Snowflake share, feeds Power BI or Tableau.","source":"https://www.pestpac.com/wavelytics"},"PLT-01":{"status":"Add-on","notes":"Multi-Branch appears only in the Enterprise package; reports can filter by branch.","source":"https://www.pestpac.com/pricing"},"PLT-02":{"status":"Unknown","notes":"A third-party review reports configurable user access roles, and portal auditor users can be limited by location; no vendor documentation found.","source":"https://connecteam.com/reviews/pestpac/"},"PLT-03":{"status":"Add-on","notes":"PestPac Cloud API covers scheduling, billing and payments with webhooks; API Integrations listed only in the Enterprise package.","source":"https://www.pestpac.com/api-integrations"},"PLT-04":{"status":"Yes","notes":"Data Services team with an analyst runs migrations from many systems, including a standard FieldRoutes script; a free CSV import utility is also offered.","source":"https://www.pestpac.com/compare/fieldroutes-vs-pestpac"},"PLT-05":{"status":"Add-on","notes":"Communication Center offers AI interaction summaries (Professional package and up). WAIve assistant and agents were announced for the WorkWave suite from Q2 2026 and an AI churn-risk Customer Hub in Oct 2026; PestPac availability and pricing are unconfirmed.","source":"https://www.pestpac.com/features/customer-communication"},"PLT-06":{"status":"Add-on","notes":"WorkWave-hosted Website Builder with lead forms feeding PestPac, per-branch domains and SEO metadata, for a separate monthly fee.","source":"https://www.pestpac.com/features/pest-control-website-builder"},"PLT-07":{"status":"Add-on","notes":"WorkWave Print Marketing (postcards, lawn signs, QR attribution) is a separate product; call tracking via CallTrackingMetrics; basic SEO in website builder.","source":"https://www.pestpac.com/marketing"}},"extra_features":[{"feature":"Smart trap integration","module":"Commercial","notes":"Bluetooth or Wi-Fi smart traps (Bell and others) report rodent activity from 50 to 100 feet away and update service records.","source":"https://www.pestpac.com/features/pest-control-mobile-app"},{"feature":"Multi-unit building management","module":"Commercial","notes":"Bulk setup of units and areas, with per-unit devices, treatments, skipped areas, signatures and unit reports.","source":"https://www.pestpac.com/features/commercial-pest-control-software"},{"feature":"Sentricon reporting to Corteva","module":"Specialty services","notes":"Automatic monthly Sentricon submissions plus Phase II stewardship and average station spacing reports.","source":"https://www.pestpac.com/features/termite-inspection-software"},{"feature":"Best Fit and Closest Tech","module":"Scheduling and dispatch","notes":"Suggests technicians for new or emergency jobs by distance and added drive time.","source":"https://www.pestpac.com/features/pest-control-scheduling-software"},{"feature":"Consumer financing and business capital","module":"Billing and payments","notes":"Pay Over Time via Wisetack for $500 to $25,000 jobs in office or app; WorkWave Capital loans via YouLend.","source":"https://www.pestpac.com/fintech"},{"feature":"Account Updater (Revenue Protect)","module":"Billing and payments","notes":"Refreshes expired or replaced stored cards automatically to cut involuntary churn; vendor says no extra charge.","source":"https://www.pestpac.com/compare/fieldroutes-vs-pestpac"},{"feature":"Accounting period lockdown","module":"Accounting","notes":"Stops transactions from posting into closed accounting periods.","source":"https://www.pestpac.com/features/accounting-software"},{"feature":"Expected material usage forecast","module":"Compliance","notes":"Projects chemical needs from scheduled jobs; distributor transaction files can be imported into inventory.","source":"https://www.pestpac.com/features/chemical-tracking-software"},{"feature":"Sales Center property insights","module":"CRM and sales","notes":"Map pins show square footage, beds, baths and nearby existing customers to prequalify door-to-door prospects.","source":"https://www.pestpac.com/features/door-to-door-pest-control-sales-software"},{"feature":"Customer surveys","module":"Customer experience","notes":"Residential customer feedback surveys listed as a PestPac solution.","source":"https://www.pestpac.com/features"},{"feature":"Portal chat and promotions","module":"Customer experience","notes":"Customers chat with agents in the portal, and operators can show marketing messages and promotions there.","source":"https://www.pestpac.com/features/customer-portal"},{"feature":"Wavelytics benchmarking and scorecards","module":"Reporting","notes":"Industry KPI benchmarking, role-based scorecards and AskWAIve natural-language questions; marked coming soon.","source":"https://www.pestpac.com/wavelytics"},{"feature":"WorkWave University training","module":"Platform","notes":"24/7 learning system, PestPac University webinars and community included with base licenses.","source":"https://www.pestpac.com/compare/fieldroutes-vs-pestpac"}]},{"slug":"fieldroutes","pest":true,"competitor":"FieldRoutes","researched_on":"2026-10-20","updated_on":"2026-10-31","profile":{"owner":"ServiceTitan (NASDAQ: TTAN); FieldRoutes brands itself 'a ServiceTitan company'. Formed in 2021 when PestRoutes and Lobster Marketing rebranded as FieldRoutes.","website":"https://www.fieldroutes.com/","target_customers":"Pest control and lawn care operators from small business to enterprise, with focus on local and regional pest companies. Showcases large door-to-door operators (Aptive, Fox, Aruza). Claims 1,700+ companies.","pricing":"Not published. Growth and Corporate tiers both say Request Pricing, with the monthly subscription based on active customer count. G2 lists a start of $350 per month per 1,000 active customers, and Capterra lists the same $350 start; older listings say $199. One 2026 reviewer cites about $364/month for under 500 customers. Marketing Pro and Fleet Pro are add-ons with no published prices, and reviewers report per-message SMS fees and payment-processing lock-in.","pricing_source":"https://fieldroutes.com/pricing","deployment":"Cloud (web-based Operations Suite) plus native iOS and Android apps.","mobile_app":"FieldRoutes App (FieldRoutes Mobile), one app for technicians and sales reps that replaced the PestRoutes Tech and PestRoutes Sales apps; iOS and Android; customer-only. Rated 3.3 from 25 ratings on the US App Store (October 2026).","integrations":["QuickBooks Online (Desktop per a third-party comparison)","Sentricon (Corteva) termite hub","ServiceTitan Marketing Pro","ServiceTitan Fleet Pro","Wisetack consumer financing","LoyaltyLoop (reviews and NPS)","Scorpion (phone system)","Sales Cookie (commissions, via API)","Open API (Premium API listed on pricing page)"],"strengths":["Strong routing and scheduling: map-based drag and drop, skill-based assignment, batch route optimization across thousands of stops.","Unified mobile app for technicians and door-to-door sales, with territories, no-knock zones, contracts, signatures and field payments.","Deep termite support: Sentricon hub with Corteva reporting, NPMA-33 forms and California Branch 3 WDO reporting.","Integrated payments with AutoPay, collections reminders and Trigger Rules automation for texts, emails and voice reminders.","Scales to multi-branch enterprise operators with open API and ServiceTitan backing and add-on products."],"weaknesses":["Recurring bugs, updates that break or move features, and slow ticket resolution are frequent review complaints.","Price is high for small companies, with extra charges for SMS, card processing and some contract changes.","Steep learning curve, especially for office and billing tasks, with thin training material for new users.","QuickBooks sync setup issues and no built-in general ledger; invoice and report customization is limited.","Key extras (marketing automation, fleet GPS, AI dash cams) are separate ServiceTitan Pro products."],"wisconsin_notes":"Kwik Kill Pest Control of Madison, Wisconsin, a ServSuite user since 2013, moved to FieldRoutes by the end of March 2023, per a FieldRoutes case study published Oct 2023; whether it still runs FieldRoutes in 2026 is unverified. No Wisconsin-specific compliance (ATCP 29, landscape registry notice) found. Only named state compliance is California Branch 3 WDO reporting and NPMA-33."},"features":{"CRM-01":{"status":"Yes","notes":"Pest CRM with lead management and pipeline visibility from first contact to signed contract.","source":"https://www.fieldroutes.com/solutions/pest-control-software"},"CRM-02":{"status":"Partial","notes":"Dashboard tracks cost per lead and customer acquisition cost; close rate or revenue by lead source not documented.","source":"https://www.fieldroutes.com/lp/pest-control-business-software"},"CRM-03":{"status":"Yes","notes":"Quotes built in the office and mobile app, including home diagrams for termite and WDO quotes. Tiered good, better, best options not confirmed.","source":"https://www.fieldroutes.com/operations-suite/fieldroutes-mobile-app"},"CRM-04":{"status":"Yes","notes":"Contracts signed in the mobile app with inline signatures; digital agreements can also be sent by email or SMS.","source":"https://apps.apple.com/us/app/-/id1583053577"},"CRM-05":{"status":"Yes","notes":"Mobile app supports door-to-door sales: territories, no-knock zones, zip code territory limits, leaderboards, sign-up and payment at the door.","source":"https://www.fieldroutes.com/blog/fieldroutes-december-release-driving-new-efficiency-in-the-field-and-office"},"CRM-06":{"status":"Add-on","notes":"Sales Cookie integration calculates commissions from FieldRoutes data; it states FieldRoutes lacks native quotas, splits and payout schedules.","source":"https://salescookie.com/Home/IFieldRoutes"},"CRM-07":{"status":"Add-on","notes":"ServiceTitan Marketing Pro runs email and direct mail campaigns (unsold estimates, win-back, upsell). Core Trigger Rules send renewal reminders.","source":"https://www.fieldroutes.com/p cted-use pesticide controls.","source":"https://capterra.com/p/25008/ServSuite/"},"CMP-07":{"status":"Yes","notes":"Inventory module tracks materials and assets by warehouse, truck or employee, with low-stock alerts; purchasing and transfers not detailed.","source":"https://editions.mydigitalpublication.com/article/ServicePro/4130998/724108/article.html"},"CMP-08":{"status":"Unknown","notes":"No public evidence of state-specific rules or report formats.","source":"https://capterra.com/p/25008/ServSuite/"},"COM-01":{"status":"Yes","notes":"Commercial mobile app tracks bait stations by barcode, recording observations, materials replaced and activity.","source":"https://international-pest-control.com/wordpress/service-pro-inc-announces-commercial-mobile-application-servsuite-ios-android-windows-tablets-2/"},"COM-02":{"status":"Yes","notes":"Technicians can create custom facility layouts; the app has a drawing feature, with movement controls added in 2025.","source":"https://international-pest-control.com/wordpress/service-pro-inc-announces-commercial-mobile-application-servsuite-ios-android-windows-tablets-2/"},"COM-03":{"status":"Partial","notes":"Station data captured by status, pest species, observations and materials; per-device trend reports not documented.","source":"https://professionalpestmanager.com/pest-control-software/software-solutions-to-boost-profits-from-termite-services/"},"COM-04":{"status":"Unknown","notes":"No public evidence of AIB, SQF or BRC audit reporting.","source":"https://capterra.com/p/25008/ServSuite/"},"COM-05":{"status":"Unknown","notes":"E-Connect portal shows services and payments; access to service reports, maps, labels or SDS not confirmed.","source":"https://professionalpestmanager.com/nz/?p=10938"},"COM-06":{"status":"Partial","notes":"Technicians record how station activity was resolved; customer-entered sighting logs not documented.","source":"https://international-pest-control.com/wordpress/service-pro-inc-announces-commercial-mobile-application-servsuite-ios-android-windows-tablets-2/"},"COM-07":{"status":"Unknown","notes":"No public evidence of PO numbers, net terms or consolidated multi-site invoices.","source":"https://capterra.com/p/25008/ServSuite/"},"SPC-01":{"status":"Yes","notes":"WDO Forms in the mobile app, drawing tools for inspection diagrams, and barcode bait station monitoring.","source":"https://apps.apple.com/us/app/servsuite-mobile/id534271165"},"SPC-02":{"status":"Unknown","notes":"No public evidence of wildlife job features; ServSensor remote wildlife monitoring was a separate product.","source":"https://www.mypmp.net/wp-content/uploads/2016/10/ServicePro_PestWorld_Exhibits_2016.pdf"},"SPC-03":{"status":"Unknown","notes":"No public evidence of bed bug job features or prep checklists.","source":"https://capterra.com/p/25008/ServSuite/"},"SPC-05":{"status":"Unknown","notes":"No public evidence of mosquito or tick programs.","source":"https://capterra.com/p/25008/ServSuite/"},"BIL-01":{"status":"Yes","notes":"Integrated card and check processing (Worldpay per app notes; a third-party audit cites Global Payments); ACH not confirmed.","source":"https://professionalpestmanager.com/nz/?p=10938"},"BIL-02":{"status":"Yes","notes":"Stores customer payment details for recurring charges; review sites also mention autopayments.","source":"https://professionalpestmanager.com/nz/?p=10938"},"BIL-03":{"status":"Unknown","notes":"No public documentation of per visit, monthly and prepay billing for the same service.","source":"https://capterra.com/p/25008/ServSuite/"},"BIL-04":{"status":"Unknown","notes":"No public documentation of jurisdiction-based sales tax.","source":"https://capterra.com/p/25008/ServSuite/"},"BIL-05":{"status":"Unknown","notes":"Review sites list collections and AR tracking, but dunning, retries, late fees or service holds are not documented.","source":"https://softwareconnect.com/reviews/servsuite-by-fieldroutes/"},"BIL-06":{"status":"Partial","notes":"Customer case ot documented.","source":"https://capterra.com/p/25008/ServSuite/"},"CX-04":{"status":"Unknown","notes":"No public evidence of automated review requests.","source":"https://capterra.com/p/25008/ServSuite/"},"CX-05":{"status":"Partial","notes":"Work orders and invoices are emailed from the app after service; listing of products applied not explicitly confirmed.","source":"https://apps.apple.com/us/app/servsuite-mobile/id534271165"},"RPT-01":{"status":"Yes","notes":"Customizable reports and dashboards covering customers, payments and services; reviewers praise reporting depth.","source":"https://editions.mydigitalpublication.com/article/ServicePro/4130998/724108/article.html"},"RPT-02":{"status":"Unknown","notes":"No public evidence of retention or churn analytics.","source":"https://capterra.com/p/25008/ServSuite/"},"RPT-03":{"status":"Partial","notes":"Case study cites reports on technician job times and material use; revenue per technician and re-service rates not documented.","source":"https://www.mypmp.net/wp-content/uploads/2015/09/PMPMAR2015ServicePro.pdf"},"RPT-04":{"status":"Yes","notes":"Customizable reports with controls over who can view which reports; BI export not confirmed.","source":"https://editions.mydigitalpublication.com/article/ServicePro/4130998/724108/article.html"},"PLT-01":{"status":"Yes","notes":"Vendor describes it as built for businesses with one or multiple branches.","source":"https://www.g2.com/products/servsuite-by-fieldroutes/reviews"},"PLT-02":{"status":"Partial","notes":"Report visibility controls and limits on printing customer data; fully configurable roles not documented.","source":"https://editions.mydigitalpublication.com/article/ServicePro/4130998/724108/article.html"},"PLT-03":{"status":"Partial","notes":"API exists; Cyclr connector exposes read-only methods for accounts, estimates, invoices and work orders. No public docs, webhooks or Zapier.","source":"https://cyclr.com/integrate/servsuite"},"PLT-04":{"status":"Unknown","notes":"No public evidence of vendor-run imports into ServSuite; FieldRoutes now migrates customers off it.","source":"https://fieldroutes.com/resources/tips-and-tools/making-the-transition-to-fieldroutes"},"PLT-05":{"status":"Unknown","notes":"No public evidence of AI features.","source":"https://capterra.com/p/25008/ServSuite/"},"PLT-06":{"status":"Unknown","notes":"No public evidence of hosted websites or embeddable lead or booking forms.","source":"https://capterra.com/p/25008/ServSuite/"},"PLT-07":{"status":"Partial","notes":"Smart Branding designs marketing materials and print-to-mail sends bills; call tracking and SEO not documented.","source":"https://professionalpestmanager.com/nz/?p=10938"}},"extra_features":[{"feature":"Product sunset and migration path","module":"Platform","notes":"FieldRoutes states ServSuite is sunsetting and offers switch discounts; no public end-of-life date found.","source":"https://fieldroutes.com/lp/ss-migration/free-demo"},{"feature":"ServSensor remote monitoring","module":"Commercial","notes":"Remote sensors report rodent and wildlife activity at inspection sites; presented in 2016 as a separate product.","source":"https://www.mypmp.net/wp-content/uploads/2016/10/ServicePro_PestWorld_Exhibits_2016.pdf"},{"feature":"Fleet management and driver behavior","module":"Scheduling and dispatch","notes":"Driver records, emergency contacts, truck service dates, plus speed and seatbelt monitoring that may lower insurance costs.","source":"https://bpca.org.uk/news-and-blog/feature/work-smarter-with-servsuite-sponsored-/265258"},{"feature":"Print-to-mail","module":"Billing and payments","notes":"Office sends bills and statements to customers through a built-in print and mail service.","source":"https://www.mypmp.net/wp-content/uploads/2015/09/PMP_JAN15-20.pdf"},{"feature":"Mobile Form Designer","module":"Technician app","notes":"Configurable mobile forms, including US default and WDO forms, with PDF annotation of linked documents.","source":"https://apps.apple.com/us/app/servsuite-mobile/id534271165"},{"feature":"Equipment and printer connectivity","module":"Technician app","notes":"Mobile app connects to B&G application equipment and Brother mobile printers.","source":"https://apps.apple.com/us/app/servsuite-mobile/id534271165"}]},{"slug":"briostack","pest":true,"competitor":"Briostack","researched_on":"2026-10-20","updated_on":"2026-10-31","profile":{"owner":"EverCommerce (Nasdaq: EVCM), which acquired Briostack in January 2021; sold under the EverPro home and field services brand. Founded by Brandon Grover; based in Lehi, Utah. EverCommerce bought AI agent company ZyraTalk in September 2025 and announced a CEO transition in August 2026.","website":"https://www.briostack.com/","target_customers":"Small and mid-sized residential and commercial pest control companies in North America, plus lawn care and mixed pest and lawn operators. Claims 3,700+ pest professionals as users. Capterra reviewers mostly have 2 to 50 employees. Strong fit for companies running door-to-door sales teams.","pricing":"Not published by the vendor: custom quotes with concurrent licensing by active users rather than total seats. Figures from a third-party demo report ($95 per month per office user, $45 per month per technician, $250 training fee, Playbooks marketing add-on $299 per month list) could not be re-verified because that page now returns 404. Terms (updated October 2025): one-year initial term from go-live that auto-renews, 30 days' notice to end, non-refundable fees and an early termination fee equal to the monthly fees for the remaining months. Published add-on fees include SMS $0.04 per text, calls $0.04 per minute, an $11 10DLC fee, $250 per additional import, $150 per custom document and $500 per database backup. Capterra lists a starting price of $50 per month (Basic). Public API Basic and Premium tiers are by quote.","pricing_source":"https://www.briostack.com/comparison/briostack-vs-jobber/","deployment":"Cloud, browser-based web app for office staff (admin work is web only), with native iOS and Android technician app.","mobile_app":"Brio Tech (iOS and Android; technician app with claimed offline support, also used for field sales and bids; version 1.4.2 released October 2026) plus Brio Sales 2 for door-to-door reps. The US App Store showed no Brio Tech ratings on 2026-10-29; a third-party review cites 2.0 from 5 ratings. Modules are branded Brio Office (web), Brio Tech (field) and Brio Sales (sales).","integrations":["QuickBooks Online (including QuickBooks Online Advanced)","CardConnect and Clover Connect payment processing (Fiserv)","Azuga fleet telematics","Voice For Pest and Voice for Turf phone systems","Swell (review requests, two-way inbox, NPS surveys)","ZyraTalk AI answering service (EverPro)","Customer Lobby Prospect Marketing direct mail (EverPro)","Baton lead referral network","Socius Marketing (digital marketing agency)","Google Maps (routing)","Public REST API with sandbox"],"strengths":["Mature scheduling and routing: cadence-based auto scheduling, seasonal templates, unlimited route optimization, bulk reschedule and multi-branch views.","Offline-capable technician app with product application capture, photos, notes, barcode scanning and field payments.","Built-in sales tooling: territories, sales maps, leaderboards, commission plans, pricing calculator and satellite-image bid diagrams.","Many reviewers praise onboarding, data migration and responsive support reps.","EverCommerce backing adds an ecosystem of add-ons (AI answering, direct mail, Swell) and a public API."],"weaknesses":["Frequent reports of glitches, crashes and new bugs after updates, including some lost data.","Contract and billing complaints: annual non-refundable terms, early termination fees, undisclosed add-on charges and SMS price increases.","Reports can be hard to find; termite graphing, bundles and skills-based routing are requested gaps; some dislike route results.","Support quality is inconsistent in negative reviews (slow replies, unreturned calls), and admin controls are limited.","No built-in general ledger (relies on QuickBooks Online); per-user pricing was a reviewer complaint, though the vendor now sells concurrent licenses by active users; seen as more pest-focused than lawn."],"wisconsin_notes":"No Wisconsin case studies or Wisconsin-specific compliance support (ATCP 29 records, landscape registry notice, posting signs) found in vendor materials; comparison pages claim WDI/WDO forms for all 50 states but never name Wisconsin. One Wisconsin user is visible: a 2026-10-29 scan of Wisconsin pest company websites found a Briostack customer portal at Werner Pest and Odor Control (Seymour). Case studies do not name customer states."},"features":{"CRM-01":{"status":"Partial","notes":"Leads managed in web and field apps, with sales funnel insights on dashboards. Defined pipeline stages are not publicly documented.","source":"https://www.briostack.com/pest-control-software/sales-lead-management-software/"},"CRM-02":{"status":"Unknown","notes":"No public mention of lead source fields or close rate by source reporting.","source":"https://www.briostack.com/pest-control-software/pest-control-crm-software/"},"CRM-03":{"status":"Yes","notes":"Bids with preset bid types, square foot or flat rate pricing calculator, photos and diagrams. Tiered good, better, best options not shown.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},"CRM-04":{"status":"Yes","notes":"Vendor lists e-signatures among paperless tools, and customers respond to proposals in the portal. Exact agreement signing flow not publicly documented.","source":"https://www.briostack.com/headphones-pest-control"},"CRM-05":{"status":"Partial","notes":"Sales app supports field sign-ups, territory assignments, partitioned sales maps and leaderboards. Knock tracking is not documented.","source":"https://www.briostack.com/pest-control-software/sales-lead-management-software/"},"CRM-06":{"status":"Yes","notes":"Custom commission plans with automated calculations and payout tracking. Holds or chargebacks on early cancellation not documented.","source":"https://www.briostack.com/pest-control-software/sales-lead-management-software/"},"CRM-07":{"status":"Add-on","notes":"Playbooks marketing add-on (Growth Bundle) supplies email and text campaign templates and reporting; a third-party demo reported $299 per month list, but that page now returns 404.","source":"https://www.briostack.com/pest-control-marketing-tools/"},"CRM-08":{"status":"Partial","notes":"Dashboards track attrition rate and win-back messages target cancelled customers. Cancellation reason codes and save workflows not documented.","source":"https://www.briostack.com/pest-control-software/pest-control-crm-software/"},"CRM-09":{"status":"Yes","notes":"Multi-unit commercial module offers billing options for multi-unit buildings and large corporate accounts. One reviewer reported apartment unit-level gaps.","source":"https://www.briostack.com/blog/save-time-and-money-with-pest-control-scheduling-software"},"CRM-10":{"status":"Add-on","notes":"Phone integration through partner Voice For Pest (Voice for Turf for lawn); native click to call or caller ID pop not documented.","source":"https://www.briostack.com/partners/"},"AGR-01":{"status":"Yes","notes":"Automated appointments from set service cadences, including twice-monthly by week and day, with service templates holding prices.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"AGR-02":{"status":"Yes","notes":"Seasonal appointment templates space each service type by a number of days. A fixed number of rounds inside a date window is not described for pest (the lawn page describes rounds), so this Yes is weak.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"AGR-03":{"status":"Partial","notes":"Pricing calculator by square foot or flat rate standardizes bids, and a vendor comparison page now claims service bundles that reviewers had reported missing; a central add-on price book is not documented.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},"AGR-04":{"status":"Yes","notes":"Bulk price changes by segment or service with customer notification. A reviewer notes it only tracks increases made through that tool.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"AGR-05":{"status":"Unknown","notes":"Renewal notices exist, but term length, auto-renewal and early cancellation fee tracking per agreement are not publicly documented.","source":"https://www.briostack.com/blog/save-time-and-money-with-pest-control-scheduling-software"},"AGR-06":{"status":"Yes","notes":"Termite and bed bug warranties with start dates and automated renewal notifications for expiring warranties.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},"AGR-07":{"status":"Partial","notes":"A third-party demo noted a reservice rate report, but that page returned 404 on 2026-10-29 and no vendor page mentions re-service; logging free return visits with cost is not documented.","source":"https://lawnstarter.com/blog/?p=52157"},"SCH-01":{"status":"Yes","notes":"Visits generated automatically from preset service cadences and multi-visit service timelines.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"SCH-02":{"status":"Yes","notes":"Calendar and map views filterable by branch, tech and color-coded category; drag and drop is listed by review sites.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"SCH-03":{"status":"Yes","notes":"Route optimization with automatic recalculation, marketed as unlimited at no extra cost. Some reviewers dislike the resulting routes.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"SCH-04":{"status":"Partial","notes":"Automatic best-fit tech recommendations exist, but skill or license criteria are not documented and reviewers request skills-based routing.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"SCH-05":{"status":"Unknown","notes":"Portal covers billing, payments, proposals and notification preferences; customer self-booking or rescheduling is not clearly documented.","source":"https://www.briostack.com/blog/an-inside-look-at-briostack"},"SCH-06":{"status":"Yes","notes":"Built-in GPS technician tracking plus Azuga fleet telematics partner. A third-party demo said GPS is not real time.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"SCH-07":{"status":"Yes","notes":"Bulk rescheduling by tech or branch, plus a bulk mover between techs and branches.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"MOB-01":{"status":"Yes","notes":"Brio Tech app for iOS and Android (version 1.4.2, October 2026), used for routes, jobs, chemical reporting and payments; door-to-door reps also have the separate Brio Sales 2 app.","source":"https://apps.apple.com/ca/app/brio-tech/id6462748506"},"MOB-02":{"status":"Yes","notes":"Scheduling page says tech app tools work with or without data connectivity and a comparison table checks offline mode, but the product FAQ says all you need is an internet connection; offline depth is undocumented.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"MOB-03":{"status":"Yes","notes":"Technicians record product applications and chemical usage on the visit from the app.","source":"https://apps.apple.com/ca/app/brio-tech/id6462748506"},"MOB-04":{"status":"Yes","notes":"App supports photos on appointments and services plus notes; signature capture is cited on vendor and review listings.","source":"https://apps.apple.com/ca/app/brio-tech/id6462748506"},"MOB-05":{"status":"Yes","notes":"Barcode scanning tracks equipment placed on job sites and reports on each site.","source":"https://www.briostack.com/pest-control-software/"},"MOB-06":{"status":"Yes","notes":"App listing confirms collecting payments in the field.","source":"https://apps.apple.com/ca/app/brio-tech/id6462748506"},"MOB-07":{"status":"Unknown","notes":"No public mention of a technician time clock; geotracking check-ins exist but hours for payroll are not documented.","source":"https://www.briostack.com/blog/save-time-and-money-with-pest-control-scheduling-software"},"MOB-08":{"status":"Unknown","notes":"No public documentation of vehicle stock being visible or editable on the device.","source":"https://www.briostack.com/pest-control-software/"},"CMP-01":{"status":"Partial","notes":"Pesticide logs and chemical usage reports are captured per visit and pitched for inspection readiness; state-specific record formats are not documented.","source":"https://www.briostack.com/headphones-pest-control"},"CMP-02":{"status":"Partial","notes":"Vendor comparison pages cite chemical and product application tracking; EPA numbers, label and SDS storage are not documented. Custom chemical lists reported by a third-party demo could not be re-verified (page now returns 404).","source":"https://www.briostack.com/comparison/briostack-vs-jobber/"},"CMP-03":{"status":"Unknown","notes":"A vendor comparison page (October 2026) lists technician licensing and product controls with no detail; license numbers, categories and expiry alerts are not documented.","source":"https://www.briostack.com/comparison/briostack-vs-gorilladesk/"},"CMP-04":{"status":"Partial","notes":"A vendor comparison page (October 2026) claims built-in state-specific WDI/WDO forms for all 50 states and a direct California Department of Agriculture integration, without feature documentation; no other state pesticide report formats are named.","source":"https://www.briostack.com/comparison/briostack-vs-gorilladesk/"},"CMP-05":{"status":"Unknown","notes":"Automated appointment reminders exist, but pesticide pre or post application notices are not documented.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"CMP-06":{"status":"Unknown","notes":"No RUP record fields or controls documented; a vendor comparison page lists technician licensing and product controls with no detail.","source":"https://www.briostack.com/comparison/briostack-vs-gorilladesk/"},"CMP-07":{"status":"Yes","notes":"Vendor FAQ claims inventory management features; warehouse, purchasing and transfer depth is not publicly documented.","source":"https://www.briostack.com/pest-control-software/"},"CMP-08":{"status":"Partial","notes":"Claims state-specific WDI/WDO forms for all 50 states and a California Department of Agriculture integration (October 2026 comparison page), without documentation; no state notice or registry rules found.","source":"https://www.briostack.com/comparison/briostack-vs-gorilladesk/"},"COM-01":{"status":"Yes","notes":"Barcode tracking of equipment placed on job sites; reviewers track bait station activity, though one says stations are entered one by one.","source":"https://www.briostack.com/blog/save-time-and-money-with-pest-control-scheduling-software"},"COM-02":{"status":"Partial","notes":"Satellite-image diagrams with bait station annotations; interior floor plan device maps are not documented.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},"COM-03":{"status":"Partial","notes":"Pest activity tracking at each job site is documented; per-device trend reports over time are not described.","source":"https://www.briostack.com/pest-control-software/"},"COM-04":{"status":"Unknown","notes":"No mention of AIB, SQF, BRC or other audit-ready documentation.","source":"https://www.briostack.com/pest-control-software/"},"COM-05":{"status":"Partial","notes":"Customer portal shows service and billing history; commercial access to maps, labels and SDS is not documented.","source":"https://www.briostack.com/blog/an-inside-look-at-briostack"},"COM-06":{"status":"Unknown","notes":"No public documentation of customer sighting logs or corrective action tracking.","source":"https://www.briostack.com/pest-control-software/"},"COM-07":{"status":"Partial","notes":"Multi-unit commercial module adds specialized billing options for large accounts; PO numbers and net terms are not documented.","source":"https://www.briostack.com/blog/save-time-and-money-with-pest-control-scheduling-software"},"SPC-01":{"status":"Partial","notes":"Satellite diagramming marketed as termite graph software, bait station annotations and termite warranties; a vendor comparison page now claims state-specific WDI/WDO forms for all 50 states and a Sentricon integration, without documentation. Reviewers want better graphing.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},"SPC-02":{"status":"Unknown","notes":"No wildlife trapping, exclusion or repair job features found.","source":"https://www.briostack.com/pest-control-software/"},"SPC-03":{"status":"Partial","notes":"Preset multi-visit service schedules are cited for bed bugs, plus bed bug warranties; customer prep checklists are not documented.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"SPC-05":{"status":"Partial","notes":"No mosquito or tick specific features named; generic seasonal appointment templates could cover seasonal programs.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"BIL-01":{"status":"Yes","notes":"Built-in payment processing through CardConnect or Clover Connect (Fiserv backend), with rate matching offered. ACH support not publicly confirmed.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"BIL-02":{"status":"Yes","notes":"Portal lets customers update billing information and automated card charging is cited; a third-party demo confirmed autopay.","source":"https://www.briostack.com/blog/an-inside-look-at-briostack"},"BIL-03":{"status":"Yes","notes":"Flexible payment models including monthly or production-based subscriptions and prepayment campaigns.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"BIL-04":{"status":"Unknown","notes":"No public documentation of tax rates by service address or per-service taxability.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"BIL-05":{"status":"Partial","notes":"Automated billing reminders, late notices and mailed collection letters; payment retries, late fees and service holds are not documented.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"BIL-06":{"status":"Unknown","notes":"Consolidated statements not documented; a reviewer requested a total outstanding balance view across accounts.","source":"https://www.capterra.com/p/160267/Briostack/reviews/?page=2"},"BIL-07":{"status":"Unknown","notes":"No public documentation of proration or balance due when an agreement is cancelled.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"ACC-01":{"status":"No","notes":"No general ledger; vendor positions QuickBooks Online as the accounting system and pushes transactions there. Receivables are handled in product.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"ACC-02":{"status":"Yes","notes":"Integrates with QuickBooks Online, including QuickBooks Online Advanced per GetApp. QuickBooks Desktop support not mentioned.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"ACC-03":{"status":"Unknown","notes":"No Sage, Xero, NetSuite or other accounting integrations found; the public API could support custom connections.","source":"https://www.briostack.com/public-api/"},"ACC-04":{"status":"Unknown","notes":"Prepayment campaigns exist, but deferred revenue recognition as visits are performed is not documented.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"ACC-05":{"status":"Unknown","notes":"Campaign profitability and operational cost reports mentioned; per-job labor and material costing with margin is not documented.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"ACC-06":{"status":"Partial","notes":"Payroll and production reports are listed; payroll provider integration and production pay rules are not documented.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"CX-01":{"status":"Yes","notes":"24/7 portal for billing details, online payments, service records, notification preferences and proposal responses.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"CX-02":{"status":"Partial","notes":"Automated text, call and email appointment reminders are documented; technician en route notices are not.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"CX-03":{"status":"Add-on","notes":"Centralized two-way client inbox came through the Swell integration (announced 2022); native two-way texting is not documented.","source":"https://stocktitan.net/news/EVCM/swell-and-briostack-team-up-to-help-pest-control-mqfitvlsfrms.html"},"CX-04":{"status":"Add-on","notes":"Google review request texts via the Swell integration; natively, the portal lets customers rate technicians after jobs.","source":"https://stocktitan.net/news/EVCM/swell-and-briostack-team-up-to-help-pest-control-mqfitvlsfrms.html"},"CX-05":{"status":"Unknown","notes":"Tech app generates documents and records products, but automatic service reports to customers listing products are not confirmed.","source":"https://apps.apple.com/ca/app/brio-tech/id6462748506"},"RPT-01":{"status":"Yes","notes":"Dashboards and reports for revenue trends and forecasts, accounts receivable, payroll and production.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"RPT-02":{"status":"Partial","notes":"Attrition rate on dashboards and a cancellations report, and Brio Insights dashboards (Growth Bundle) track cancellations; breakdowns by route, technician or service are not documented.","source":"https://www.briostack.com/pest-control-software/pest-control-crm-software/"},"RPT-03":{"status":"Partial","notes":"Production and payroll reports exist; a reservice rate report was reported only by a third-party demo whose page now returns 404, and time on site and per-technician productivity detail are not documented.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},"RPT-04":{"status":"Partial","notes":"Review sites list customizable reports and the public API exposes data; no documented report builder, and reviewers say reports are hard to find.","source":"https://www.getapp.com/communication-software/a/briostack/"},"PLT-01":{"status":"Yes","notes":"Multiple branches and work units with branch filters, bulk moves between branches and multi-location receivables.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},"PLT-02":{"status":"Unknown","notes":"Role configuration is not documented; reviewers cite limited admin controls that require support for changes.","source":"https://www.getapp.com/industries-software/a/briostack/reviews/"},"PLT-03":{"status":"Yes","notes":"Public API with sandbox docs; free tier of 350 requests per month, paid Basic and Premium tiers. Webhooks and Zapier not mentioned.","source":"https://www.briostack.com/public-api/"},"PLT-04":{"status":"Yes","notes":"Onboarding includes data transfer and case studies cite migration. The published fee schedule charges $250 per additional import, $150 per non-standard data manipulation and $500 for Sentricon migration.","source":"https://www.briostack.com/case-studies/"},"PLT-05":{"status":"Add-on","notes":"ZyraTalk AI answering service (EverPro) for inbound calls, priced by quote. A vendor page (October 2026) lists AI Note Refiner and Pest Identifier in preview and an AI Brio Assistant in development; Customer Lobby direct mail uses predictive AI targeting.","source":"https://www.briostack.com/ai-answering-service/"},"PLT-06":{"status":"Unknown","notes":"No hosted website or embeddable lead or booking forms found; marketing agency partner Socius Marketing is offered separately.","source":"https://www.briostack.com/partners/"},"PLT-07":{"status":"Add-on","notes":"Customer Lobby prospect postcards via EverPro, Socius Marketing agency and Baton referrals are partner services; native click to mail letters also exist.","source":"https://www.briostack.com/direct-mail/"}},"extra_features":[{"feature":"Satellite-image property diagramming with square footage calculation","module":"CRM and sales","notes":"Techs annotate high-resolution satellite images with treatment plans and bait stations, compute square footage and attach diagrams to bids.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},{"feature":"Sales leaderboards","module":"CRM and sales","notes":"Customizable company-wide or territory-specific leaderboards for sales reps, plus sales analytics.","source":"https://www.briostack.com/pest-control-software/sales-lead-management-software/"},{"feature":"Bid interest ranking and preset bid types","module":"CRM and sales","notes":"Bids are categorized by preset type and service category and ranked by customer interest level.","source":"https://www.briostack.com/pest-control-software/bids-diagramming-software/"},{"feature":"Bulk SMS broadcasts","module":"Customer experience","notes":"Send one text to all customers for weather delays or office closures.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},{"feature":"Preferred contact channel routing including voice calls and mail","module":"Customer experience","notes":"Reminders, invoices and quotes go out by each customer's preferred channel: email, text, recorded phone call or mail.","source":"https://www.briostack.com/pest-control-software/pest-control-crm-software/"},{"feature":"Click To Mail printed letters and postcards","module":"Platform","notes":"Automated printed mail for renewal notices, collections and sales, sent from inside the product.","source":"https://www.briostack.com/blog/save-time-and-money-with-pest-control-scheduling-software"},{"feature":"Technician self-routing with live re-optimization","module":"Technician app","notes":"Techs can control their own schedule and route, reschedule with best-fit recommendations, and get turn-by-turn directions that re-optimize while driving.","source":"https://www.briostack.com/pest-control-software/scheduling-routing-software/"},{"feature":"Revenue forecasting","module":"Reporting","notes":"Revenue forecasts and expected revenue by service based on scheduled work.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},{"feature":"Discount campaign management","module":"Billing and payments","notes":"Run discount campaigns and track their profitability.","source":"https://www.briostack.com/pest-control-software/invoicing-accounting-software/"},{"feature":"NPS surveys and internal team chat (Swell)","module":"Customer experience","notes":"Swell integration adds private NPS survey texts and group or one-on-one chat among office, sales and technicians.","source":"https://stocktitan.net/news/EVCM/swell-and-briostack-team-up-to-help-pest-control-mqfitvlsfrms.html"},{"feature":"Lead referral network (Baton)","module":"CRM and sales","notes":"Partner network where companies refer vetted, exclusive leads to each other and pay only for matching referrals.","source":"https://www.briostack.
